name: Build Blog Writer APK

on:
  workflow_dispatch:
  push:
    paths:
      - "BlogWriterAssistantProject.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unzip Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q BlogWriterAssistantProject.zip -d project

      - name: Show project files
        run: |
          find project -maxdepth 4 -type f | sort
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp project/app/build/outputs/apk/debug/app-debug.apk              output/BlogWriterAssistant.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlogWriterAssistant-APK
          path: output/BlogWriterAssistant.apk
          if-no-files-found: error
          retention-days: 30
